<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Command Center</title>
    <meta
      name="description"
      content="Visual portfolio command center, pre-flight reviewer, and experimental sandbox for project observation and navigation."
    />
    <meta property="og:title" content="Command Center" />
    <meta
      property="og:description"
      content="Visual portfolio command center, pre-flight reviewer, and experimental sandbox for project observation and navigation."
    />
    <!-- Futuristic Typography: Orbitron, Chakra Petch, JetBrains Mono, Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* --- Base Obsidian & Futuristic Screen Theme Variables --- */
      :root {
        --background-primary: #070a14;
        --background-primary-alt: #0b1120;
        --background-secondary: #0c1527;
        --background-secondary-alt: #101c34;
        --background-modifier-border: rgba(56, 189, 248, 0.25);
        --background-modifier-form-field: #0d162a;
        --text-normal: #e2e8f0;
        --text-muted: #7dd3fc;
        --text-faint: #38bdf8;
        --text-accent: #00f0ff;
        --interactive-normal: #101c34;
        --interactive-hover: #172a4d;
        --interactive-accent: #00f0ff;
        --font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-display: "Orbitron", -apple-system, BlinkMacSystemFont, sans-serif;
        --font-tech: "Chakra Petch", -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      body.theme-light {
        --background-primary: #f0f4f8;
        --background-primary-alt: #e2e8f0;
        --background-secondary: #ffffff;
        --background-secondary-alt: #f1f5f9;
        --background-modifier-border: rgba(14, 165, 233, 0.25);
        --background-modifier-form-field: #ffffff;
        --text-normal: #0f172a;
        --text-muted: #0284c7;
        --text-faint: #64748b;
        --text-accent: #0284c7;
        --interactive-normal: #ffffff;
        --interactive-hover: #e0f2fe;
        --interactive-accent: #0284c7;
      }

      body.vibe-classic {
        --background-primary: #1e1e1e;
        --background-primary-alt: #252526;
        --background-secondary: #252526;
        --background-secondary-alt: #2d2d2d;
        --background-modifier-border: #3c3c3c;
        --text-normal: #dcddde;
        --text-muted: #8e8e8e;
        --text-accent: #7c3aed;
        --interactive-normal: #2d2d2d;
        --interactive-hover: #3c3c3c;
        --interactive-accent: #7c3aed;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: var(--font-family);
        background-color: #03060c;
        background-image: 
          radial-gradient(ellipse at 50% 10%, rgba(14, 165, 233, 0.12) 0%, rgba(3, 6, 12, 0) 70%),
          radial-gradient(ellipse at 50% 0%, rgba(16, 28, 54, 0.45) 0%, rgba(3, 6, 12, 0.95) 85%),
          repeating-linear-gradient(90deg, #070d18 0px, #070d18 46px, #03060c 46px, #03060c 48px);
        color: var(--text-normal);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body.theme-light {
        background-color: #e2e8f0;
        background-image:
          radial-gradient(ellipse at 50% 20%, rgba(255, 255, 255, 0.7) 0%, rgba(226, 232, 240, 0.95) 85%),
          repeating-linear-gradient(90deg, #e2e8f0 0px, #e2e8f0 46px, #cbd5e1 46px, #cbd5e1 48px);
      }

      body.vibe-classic {
        background-image: none !important;
        background-color: #1e1e1e !important;
      }

      #app {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
      }

      /* --- Top Sandbox Cockpit Header --- */
      .cc-sandbox-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.6rem 1.25rem;
        background: #080d1a;
        border-bottom: 1px solid rgba(56, 189, 248, 0.25);
        flex-shrink: 0;
        gap: 1rem;
        backdrop-filter: blur(12px);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
        z-index: 50;
      }

      .cc-header-brand {
        display: flex;
        align-items: center;
        gap: 0.65rem;
      }

      .cc-header-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        background: linear-gradient(135deg, #0284c7, #00f0ff);
        border-radius: 8px;
        font-size: 0.95rem;
        color: #03060c;
        font-weight: 900;
        box-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
      }

      .cc-header-title {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 0.92rem;
        letter-spacing: 0.06em;
        color: #f0fdf4;
        text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
      }

      .cc-header-sub {
        font-size: 0.72rem;
        color: #7dd3fc;
        letter-spacing: -0.01em;
      }

      .cc-header-tabs {
        display: flex;
        gap: 0.35rem;
        background: #050914;
        padding: 0.2rem;
        border-radius: 8px;
        border: 1px solid rgba(56, 189, 248, 0.2);
      }

      .cc-tab-btn {
        background: transparent;
        border: none;
        color: #7dd3fc;
        padding: 0.35rem 0.85rem;
        border-radius: 6px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .cc-tab-btn:hover {
        color: #ffffff;
      }

      .cc-tab-btn.active {
        background: #0284c7;
        color: #ffffff;
        font-weight: 700;
        box-shadow: 0 0 10px rgba(14, 165, 233, 0.5);
      }

      .cc-header-controls {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .cc-toggle-label {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.78rem;
        color: #7dd3fc;
        cursor: pointer;
        user-select: none;
      }

      .cc-theme-btn, .cc-vibe-btn, .cc-reset-btn {
        background: #0d162a;
        border: 1px solid rgba(56, 189, 248, 0.3);
        color: #e2e8f0;
        padding: 0.35rem 0.75rem;
        border-radius: 6px;
        font-size: 0.78rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .cc-theme-btn:hover, .cc-vibe-btn:hover, .cc-reset-btn:hover {
        background: #172a4d;
        border-color: #00f0ff;
        color: #ffffff;
        box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        transform: translateY(-1px);
      }

      .cc-vibe-btn.active {
        border-color: #00f0ff;
        color: #00f0ff;
        box-shadow: 0 0 10px rgba(0, 240, 255, 0.25);
      }

      .cc-sandbox-panel {
        flex: 1;
        overflow-y: auto;
        padding: 2rem;
      }

      /* --- Modern Panel Styles --- */
      .review-card {
        max-width: 920px;
        margin: 0 auto;
        background: #0a1120;
        border: 1px solid rgba(56, 189, 248, 0.3);
        border-radius: 12px;
        padding: 1.75rem 2.25rem;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      }

      .review-card h2 {
        margin-top: 0;
        font-size: 1.4rem;
        font-family: var(--font-display);
        color: #f0fdf4;
        letter-spacing: 0.02em;
      }

      .review-card h3 {
        margin-top: 1.75rem;
        font-size: 1.05rem;
        font-family: var(--font-tech);
        color: #38bdf8;
        letter-spacing: 0.04em;
        border-bottom: 1px solid rgba(56, 189, 248, 0.2);
        padding-bottom: 0.4rem;
      }

      .badge-row {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-bottom: 1.25rem;
      }

      .badge {
        padding: 0.25rem 0.65rem;
        border-radius: 6px;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        font-family: var(--font-mono);
      }

      .badge-success {
        background: rgba(16, 185, 129, 0.16);
        color: #34d399;
        border: 1px solid rgba(16, 185, 129, 0.4);
      }

      .badge-info {
        background: rgba(14, 165, 233, 0.16);
        color: #38bdf8;
        border: 1px solid rgba(14, 165, 233, 0.4);
      }

      .review-text {
        font-size: 0.92rem;
        line-height: 1.6;
        color: var(--text-normal);
      }

      .review-list {
        padding-left: 1.25rem;
        font-size: 0.88rem;
        line-height: 1.65;
      }

      .review-list li {
        margin-bottom: 0.45rem;
      }

      .vault-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 0.85rem;
        margin-top: 1rem;
      }

      .vault-card {
        background: #080e1b;
        border: 1px solid rgba(56, 189, 248, 0.25);
        border-radius: 8px;
        padding: 0.9rem 1.1rem;
        transition: transform 0.15s ease, border-color 0.15s ease;
      }

      .vault-card:hover {
        border-color: #00f0ff;
        box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
        transform: translateY(-2px);
      }

      .vault-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.4rem;
      }

      .vault-id {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        color: #7dd3fc;
      }

      .vault-status {
        font-family: var(--font-mono);
        font-size: 0.68rem;
        font-weight: 700;
        text-transform: uppercase;
        padding: 0.15rem 0.45rem;
        border-radius: 4px;
        letter-spacing: 0.04em;
      }

      .status-current { background: rgba(14, 165, 233, 0.18); color: #38bdf8; border: 1px solid rgba(14, 165, 233, 0.4); }
      .status-planned { background: rgba(245, 158, 11, 0.18); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
      .status-possible { background: rgba(139, 92, 246, 0.18); color: #c084fc; border: 1px solid rgba(139, 92, 246, 0.4); }
      .status-ongoing { background: rgba(16, 185, 129, 0.18); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
      .status-archived { background: rgba(107, 114, 128, 0.18); color: #9ca3af; border: 1px solid rgba(107, 114, 128, 0.4); }

      .vault-name {
        font-weight: 600;
        font-size: 0.95rem;
        margin-bottom: 0.45rem;
        line-height: 1.35;
        color: #f8fafc;
      }

      .vault-field {
        font-size: 0.78rem;
        color: #94a3b8;
        margin-top: 0.25rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .trigger-btn {
        background: #0d182e;
        border: 1px solid rgba(56, 189, 248, 0.35);
        color: #e2e8f0;
        padding: 0.45rem 0.85rem;
        border-radius: 6px;
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .trigger-btn:hover {
        background: #172a4d;
        border-color: #00f0ff;
        color: #ffffff;
      }

      /* --- FUTURISTIC COMPUTER SCREEN ENVIRONMENT & ACCENTS --- */

      /* Base Buttons */
      button {
        font-family: inherit;
        background: var(--interactive-normal);
        color: var(--text-normal);
        border: 1px solid var(--background-modifier-border);
        border-radius: 6px;
        transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
      }

      button:disabled {
        opacity: 0.35;
        cursor: not-allowed !important;
      }

      /* Futuristic Screen Stage */
      .cc-boardroom-stage,
      .cc-screen-stage {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 0.85rem 1.75rem 1.25rem 1.75rem;
        box-sizing: border-box;
        align-items: center;
        justify-content: stretch;
        overflow: hidden;
        min-height: 0;
        background: #03060c;
        background-image: radial-gradient(circle at 50% 15%, rgba(14, 165, 233, 0.08) 0%, transparent 65%);
      }

      /* The Futuristic Monitor / Computer Screen Chassis */
      .cc-boardroom-corkboard,
      .cc-futuristic-screen {
        flex: 1;
        width: 100%;
        max-width: 1340px;
        display: flex;
        flex-direction: column;
        position: relative;
        /* Cybernetic screen canvas with subtle raster scanlines & coordinate grid */
        background-color: #060913;
        background-image:
          /* Layer 1: Fine coordinate laser grid */
          linear-gradient(rgba(56, 189, 248, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(56, 189, 248, 0.04) 1px, transparent 1px),
          /* Layer 2: CRT / Holographic micro-scanlines */
          repeating-linear-gradient(0deg, rgba(0, 240, 255, 0.016) 0px, rgba(0, 240, 255, 0.016) 1px, transparent 1px, transparent 3px),
          /* Layer 3: Central cathode phosphorescent bloom */
          radial-gradient(ellipse at 50% 25%, rgba(14, 165, 233, 0.09) 0%, rgba(6, 9, 19, 0.95) 85%);
        background-size: 36px 36px, 36px 36px, 100% 3px, 100% 100%;
        background-position: 0 0, 0 0, 0 0, 0 0;
        /* Sleek aerospace dark titanium screen bezel */
        border: 14px solid #0d1527;
        border-image: linear-gradient(135deg, #182848 0%, #0d1527 35%, #080e1a 70%, #15223c 100%) 14;
        border-radius: 12px;
        box-shadow:
          0 0 0 1px rgba(56, 189, 248, 0.35),
          0 0 40px rgba(14, 165, 233, 0.22),
          0 28px 75px -12px rgba(0, 0, 0, 0.95),
          inset 0 0 45px rgba(0, 0, 0, 0.8),
          inset 0 0 0 1px rgba(56, 189, 248, 0.2);
        overflow: hidden;
        min-height: 0;
      }

      /* Subtle holographic anti-glare reflection sweep */
      .cc-boardroom-corkboard::before,
      .cc-futuristic-screen::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 22px;
        height: 28%;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(56, 189, 248, 0.03) 25%, transparent 60%);
        pointer-events: none !important;
        z-index: 1;
      }

      /* Top Tactical Screen HUD Header Ribbon */
      .cc-corkboard-brass-header,
      .cc-screen-hud-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.5rem 1.4rem;
        background: linear-gradient(90deg, #091224 0%, #0d1b36 50%, #091224 100%);
        border-bottom: 1px solid rgba(56, 189, 248, 0.4);
        box-shadow: 
          0 3px 12px rgba(0, 0, 0, 0.6),
          inset 0 1px 0 rgba(56, 189, 248, 0.25);
        flex-shrink: 0;
        z-index: 10;
        user-select: none;
      }

      .cc-hud-status-left,
      .cc-corkboard-pins-left {
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }

      .cc-hud-status-right,
      .cc-corkboard-pins-right {
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }

      /* Tactical status pulse dot */
      .cc-hud-pulse-dot,
      .cc-brass-pin {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #00f0ff;
        box-shadow: 0 0 10px #00f0ff;
        animation: cc-hud-pulse 2s infinite ease-in-out;
        border: none;
      }

      @keyframes cc-hud-pulse {
        0%, 100% { opacity: 0.8; transform: scale(0.95); }
        50% { opacity: 1; transform: scale(1.15); box-shadow: 0 0 14px #00f0ff; }
      }

      .cc-hud-sys-tag {
        font-family: var(--font-mono);
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: #94a3b8;
      }

      .cc-hud-telemetry-tag {
        font-family: var(--font-mono);
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: #34d399;
        text-shadow: 0 0 8px rgba(52, 211, 153, 0.4);
      }

      .cc-corkboard-plaque-tag,
      .cc-hud-title-tag {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-family: var(--font-display);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #e0f2fe;
        text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
      }

      .cc-corkboard-dot,
      .cc-hud-reticle-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #00f0ff;
        box-shadow: 0 0 8px #00f0ff;
      }

      .cc-corkboard-title,
      .cc-hud-title {
        color: #e0f2fe;
      }

      .cc-corkboard-status,
      .cc-hud-badge {
        background: rgba(14, 165, 233, 0.15);
        color: #00f0ff;
        padding: 0.15rem 0.55rem;
        border-radius: 4px;
        font-family: var(--font-mono);
        font-size: 0.66rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        border: 1px solid rgba(0, 240, 255, 0.4);
        box-shadow: 0 0 8px rgba(0, 240, 255, 0.25);
      }

      /* Bottom Tactical Sub-Console Frequency Dock */
      .cc-corkboard-pin-rail,
      .cc-screen-dock {
        display: flex;
        flex-direction: column;
        background: linear-gradient(180deg, #0d162a 0%, #070e1b 100%);
        border-top: 1px solid rgba(56, 189, 248, 0.35);
        box-shadow: 
          0 -5px 16px rgba(0, 0, 0, 0.6),
          inset 0 1px 1px rgba(56, 189, 248, 0.2);
        padding: 0.45rem 1.5rem 0.65rem 1.5rem;
        flex-shrink: 0;
        z-index: 10;
        position: relative;
      }

      .cc-pin-rail-lip,
      .cc-screen-dock-lip {
        position: absolute;
        top: -2px;
        left: 20px;
        right: 20px;
        height: 2px;
        background: #00f0ff;
        box-shadow: 0 0 8px #00f0ff;
      }

      .cc-pin-rail-contents,
      .cc-screen-dock-contents {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        flex-wrap: wrap;
      }

      .cc-pushpin-item,
      .cc-screen-channel {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        cursor: pointer;
        transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), filter 0.18s ease;
        user-select: none;
        padding: 3px 8px;
        border-radius: 6px;
        border: 1px solid transparent;
      }

      .cc-pushpin-item:hover,
      .cc-screen-channel:hover {
        transform: translateY(-2px);
        background: rgba(14, 165, 233, 0.1);
        border-color: rgba(56, 189, 248, 0.4);
      }

      .cc-pushpin-item.active,
      .cc-screen-channel.active {
        background: rgba(14, 165, 233, 0.18);
        border: 1px solid rgba(0, 240, 255, 0.5);
        box-shadow: 0 0 10px rgba(0, 240, 255, 0.25);
      }

      .cc-pin-head,
      .cc-channel-led {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #00f0ff;
        box-shadow: 0 0 6px #00f0ff;
      }

      .cc-pin-label,
      .cc-channel-label {
        font-family: var(--font-mono);
        font-size: 0.68rem;
        font-weight: 700;
        color: #7dd3fc;
        letter-spacing: 0.06em;
      }

      /* Re-Calibrate HUD Tool */
      .cc-cork-action-tool,
      .cc-screen-action-tool {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        background: linear-gradient(180deg, #10203a 0%, #0b1527 100%);
        border: 1px solid rgba(0, 240, 255, 0.5);
        border-radius: 6px;
        padding: 4px 12px;
        cursor: pointer;
        box-shadow: 0 0 10px rgba(0, 240, 255, 0.25);
        transition: all 0.15s ease;
        user-select: none;
      }

      .cc-cork-action-tool:hover,
      .cc-screen-action-tool:hover {
        background: linear-gradient(180deg, #172d52 0%, #0e1b33 100%);
        border-color: #00f0ff;
        box-shadow: 0 0 16px rgba(0, 240, 255, 0.5);
        transform: translateY(-1px);
      }

      .cc-tool-icon {
        font-size: 0.8rem;
        color: #00f0ff;
      }

      .cc-tool-text {
        font-family: var(--font-display);
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #00f0ff;
      }

      /* --- VIEWPORT INSIDE THE COMPUTER SCREEN --- */
      .cc-sandbox-main-area {
        flex: 1 1 auto;
        overflow-y: auto !important;
        overflow-x: hidden !important;
        overscroll-behavior-y: contain !important;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        background: transparent;
        position: relative;
        z-index: 5;
        min-height: 0;
        padding: 0 1.75rem !important;
        scroll-behavior: smooth;
      }

      /* Physical Top & Bottom Spacers: Guarantees that at scrollTop=0,
         the user completely sees screen background above the card,
         and the card's top rounded corners and glowing rivets are 100% visible */
      .cc-screen-top-spacer {
        height: 36px;
        min-height: 36px;
        width: 100%;

  </head>
  <body class="theme-dark">
    <div id="app"></div>
    <script type="module" src="/dist/sandbox.js"></script>
    <script>
      // Add Futuristic Screen / Classic switcher button to header once DOM is ready
      window.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => {
          const controls = document.querySelector(".cc-header-controls");
          if (controls) {
            const vibeBtn = document.createElement("button");
            vibeBtn.type = "button";
            vibeBtn.className = "cc-vibe-btn active";
            vibeBtn.id = "toggle-vibe";
            vibeBtn.innerHTML = "🖥️ Futuristic Screen: ON";
            vibeBtn.title = "Toggle between Futuristic Computer Screen and Vanilla Classic Obsidian";

            vibeBtn.addEventListener("click", () => {
              const isClassic = document.body.classList.toggle("vibe-classic");
              vibeBtn.classList.toggle("active", !isClassic);
              vibeBtn.innerHTML = isClassic ? "🪵 Classic Obsidian: ON" : "🖥️ Futuristic Screen: ON";
            });

            controls.prepend(vibeBtn);
          }
        }, 50);
      });
    </script>
  </body>
</html>
